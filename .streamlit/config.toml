[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
# Auto-reload re-imports changed modules, which would forget every visitor's uploaded documents.
fileWatcherType = "none"

[theme]
primaryColor = "#0F766E"
borderColor = "#D6DEDC"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.5rem"
showSidebarBorder = true

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F6"
textColor = "#14211F"

[theme.dark]
primaryColor = "#0D9488"
backgroundColor = "#0E1716"
secondaryBackgroundColor = "#16211F"
textColor = "#E6EEEC"
borderColor = "#2A3836"
